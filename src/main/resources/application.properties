server.port=8080

# Conexión a MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_san_marcos?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA (crea y actualiza tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración JWT
jwt.secret=ClaveSecretaSuperSeguraParaVeterinariaSanMarcos2026FullStackII
jwt.expiration=86400000

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html